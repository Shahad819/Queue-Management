<!DOCTYPE html>
<html>
<head>
  <title>Status</title>
  <link rel="stylesheet" href="styles.css">
</head>

<body onload="showStatus(); startQueueWatcher()"></body>

<header><h1>Your Queue Status</h1></header>

<nav>
  <a href="index.html">Home</a>
</nav>

<div class="container">

<div class="queue-box">

  <h2>🎫 Token: <span id="token"></span></h2>

  <p id="notify" style="color:red;"></p>

  <button onclick="cancelQueue()">Cancel Queue</button>

</div>

<script src="script.js"></script>

</body>
</html>
